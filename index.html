<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#173c32"><link rel="manifest" href="manifest.json"><title>Bass Academy</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f7f3;color:#20352d;font:16px system-ui}main{max-width:680px;margin:auto;padding:20px 18px 100px}header{display:flex;justify-content:space-between;align-items:center;font-weight:800;margin-bottom:24px}h1,h2,p{margin:0 0 12px}h1{font-size:28px}small,.muted{color:#65776e}button{font:inherit;font-weight:700;border:1px solid #d6ded7;border-radius:14px;background:white;color:inherit;padding:13px;cursor:pointer}button:disabled{opacity:.5;cursor:default}.primary{background:#287a50;color:white;border:0;box-shadow:0 4px #185b38;width:100%}.hero{background:#173c32;color:white;padding:24px;border-radius:22px}.hero small{color:#c4e4d3}.panel{background:white;border:1px solid #dce5dd;border-radius:20px;padding:18px;margin:15px 0}.lesson{display:flex;align-items:center;gap:18px;margin:24px 0}.circle{width:64px;height:60px;border-radius:50%;background:#287a50;color:white;box-shadow:0 5px #185b38;font-size:22px;flex-shrink:0}.circle:disabled{background:#d9e0da;color:#677;box-shadow:none}.track{height:12px;background:#dce5dd;border-radius:20px;overflow:hidden;margin:14px 0}.bar{height:100%;background:#62b780}.choices{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:15px 0}.good{background:#dcf4df;color:#176339;border-color:#58a66a}.bad{background:#ffe5e5;color:#a52222;border-color:#d66}.nav{position:fixed;bottom:0;left:0;right:0;background:white;border-top:1px solid #dce5dd;display:flex;justify-content:center;padding:8px 8px max(8px,env(safe-area-inset-bottom));gap:6px}.nav button{border:0;min-width:65px;font-size:13px}.piano{position:relative;display:flex;height:130px;margin:12px 0 22px}.white{flex:1;min-width:0;padding:0 0 8px;border:1px solid #87958d;border-radius:0 0 5px 5px;display:flex;align-items:end;justify-content:center;font-size:10px}.black{position:absolute;top:0;background:#23312b;height:60%;border-radius:0 0 4px 4px;pointer-events:none}.row{display:flex;gap:8px;align-items:center;justify-content:space-between}.row button{flex:1}svg{display:block;width:100%;max-height:240px}.pill{font-size:13px;color:#287a50;font-weight:700}input{max-width:100%}@media(prefers-color-scheme:dark){body{background:#15201b;color:#e3eee6}.panel,button,.nav{background:#22332a;border-color:#405248}.muted,small{color:#a5b9ac}.white{background:#fff;color:#222}.good{background:#244b32;color:#a4edb0}.bad{background:#542d2d;color:#ffb0b0}}
</style></head><body><main id="app"></main><script>
const $=document.getElementById('app'), names=['C','D','E','F','G','A','B'], sem=[0,2,4,5,7,9,11];const note=p=>names[((p+4)%7+7)%7], oct=p=>2+Math.floor((p+4)/7), full=p=>note(p)+oct(p), midi=p=>12*(oct(p)+1)+sem[names.indexOf(note(p))];const range=(a,b)=>Array.from({length:b-a+1},(_,i)=>a+i), rand=a=>a[Math.floor(Math.random()*a.length)];
const lessons=[['Anchor notes','G, D and F','name',[0,4,6]],['Five lines','G B D F A','name',[0,2,4,6,8]],['Four spaces','A C E G','name',[1,3,5,7]],['Mix it up','All staff notes','name',range(0,8)],['Middle C','Above the staff','key',range(6,12)],['Deep bass','Below the staff','key',range(-4,2)],['Keyboard fluency','Exact pitches','key',range(-4,12)],['Intervals','Seconds to fifths','interval',range(0,6)],['Triads','Major and minor chords','chord',[-4,-1,0,3,4,7]],['Left-hand melodies','Play four notes in order','melody',range(0,8)],['Bass mastery','Mixed sight-reading','mixed',range(-4,12)]];
let d={xp:0,done:[],weak:{},days:[],best:0};try{Object.assign(d,JSON.parse(localStorage.getItem('bass-v2')||'{}'))}catch{};function save(){try{localStorage.setItem('bass-v2',JSON.stringify(d))}catch{}}let s=null,timer=null,access=null,audio=null;function sound(p){try{audio??=new (window.AudioContext||window.webkitAudioContext)();audio.resume();let o=audio.createOscillator(),g=audio.createGain();o.type='triangle';o.frequency.value=440*2**((midi(p)-69)/12);g.gain.setValueAtTime(.12,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+.45);o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+.46)}catch{}}
function day(t=new Date()){return t.getFullYear()+'-'+(t.getMonth()+1)+'-'+t.getDate()}function streak(){let t=new Date(),n=0;if(!d.days.includes(day(t)))t.setDate(t.getDate()-1);while(d.days.includes(day(t))){n++;t.setDate(t.getDate()-1)}return n}function head(){return `<header><span>♫ Bass Academy</span><span>🔥 ${streak()}　⚡ ${d.xp}</span></header>`}function nav(){return `<nav class="nav"><button onclick="home()">⌂ Learn</button><button onclick="start(3,'review')">↻ Review</button><button onclick="start(3,'timed')">◷ Speed</button><button onclick="reference()">♫ Notes</button><button onclick="settings()">⚙ Setup</button></nav>`}function stop(){clearInterval(timer);timer=null;s=null}function home(){stop();$.innerHTML=head()+`<div class="hero"><small>YOUR LEARNING PATH</small><h1>Read the bass clef</h1><p>${d.done.length} of ${lessons.length} lessons complete</p><div class="track"><div class="bar" style="width:${100*d.done.length/lessons.length}%"></div></div></div>`+lessons.map((l,i)=>`<div class="lesson" style="margin-left:${[0,24,48,24][i%4]}px"><button class="circle" ${i&&!d.done.includes(i-1)&&!d.done.includes(i)?'disabled':''} onclick="start(${i})">${d.done.includes(i)?'✓':i&&!d.done.includes(i-1)?'🔒':'★'}</button><div><b>${l[0]}</b><br><small>${l[1]}</small></div></div>`).join('')+nav()}
function staff(ps,chord=false,labels=false,active=-1){let h='<svg viewBox="0 0 360 220" role="img" aria-label="Bass clef staff">';for(let y=65;y<=145;y+=20)h+=`<path d="M12 ${y}H348" stroke="currentColor" stroke-width="1.2"/>`;h+='<path d="M29 85 C18 65 48 65 57 80 C72 106 48 133 22 145 C43 128 61 104 51 84 C45 72 33 74 32 83 Z" fill="currentColor"/><circle cx="29" cy="85" r="6" fill="currentColor"/><circle cx="72" cy="75" r="3.4" fill="currentColor"/><circle cx="72" cy="95" r="3.4" fill="currentColor"/>';ps.forEach((p,i)=>{let x=chord?205:ps.length===1?205:105+i*230/(ps.length-1),y=145-p*10;for(let k=-2;k>=p;k-=2)h+=`<path d="M${x-13} ${145-k*10}h26" stroke="currentColor"/>`;for(let k=10;k<=p;k+=2)h+=`<path d="M${x-13} ${145-k*10}h26" stroke="currentColor"/>`;h+=`<ellipse cx="${x}" cy="${y}" rx="9" ry="6" transform="rotate(-15 ${x} ${y})" fill="${i===active?'#32a568':'currentColor'}"/>`;if(!chord&&!labels)h+=`<path d="M${x+(p>=4?-8:8)} ${y}v${p>=4?30:-30}" stroke="currentColor" stroke-width="1.5"/>`;if(labels)h+=`<text x="${x}" y="211" text-anchor="middle" fill="currentColor" font-size="13">${full(p)}</text>`});return h+'</svg>'}
function start(i,mode='lesson'){stop();s={i,mode,n:0,correct:0,hearts:5,remaining:60,feedback:null,step:0};next();if(mode==='timed')timer=setInterval(()=>{if(!s)return;s.remaining--;let el=document.getElementById('clock');if(el)el.textContent=s.remaining+'s';if(s.remaining<=0)finish()},1000)}function next(){let l=lessons[s.i],pool=s.mode==='review'?Object.keys(d.weak).filter(k=>d.weak[k]>0).map(Number):l[3];if(!pool.length)pool=range(0,8);let p=rand(pool);if(s.q&&pool.length>1&&p===s.q.ps[0])p=pool[(pool.indexOf(p)+1)%pool.length];let type=s.mode!=='lesson'?'name':l[2];if(type==='mixed')type=rand(['name','key','interval','melody']);let ps=[p],ans=note(p);if(type==='key')ans=full(p);if(type==='interval'){let delta=rand([1,2,3,4]);ps.push(p+delta);ans=String(delta+1)}if(type==='chord'){ps=[p,p+2,p+4];ans=midi(p+2)-midi(p)===4?'Major':'Minor'}if(type==='melody'){ps=[p,...Array.from({length:3},()=>rand(range(Math.max(-4,p-3),Math.min(12,p+3))))];ans=full(p)}s.q={type,ps,ans};s.feedback=null;s.step=0;quiz()}
function keyboard(){let keys=range(-4,16),n=keys.length;return `<div class="piano">${keys.map(p=>`<button class="white ${s.feedback&&full(p)===s.q.ans?'good':''}" onclick="key(${p})" aria-label="${full(p)}">${note(p)==='C'?full(p):''}</button>`).join('')}${keys.map((p,i)=>!['E','B'].includes(note(p))&&i<n-1?`<i class="black" style="left:${(i+1)*100/n-1.5}%;width:3%"></i>`:'').join('')}</div>`}function key(p){sound(p);if(s&&!s.feedback&&['key','melody'].includes(s.q.type))answer(full(p))}
function quiz(){let q=s.q,choices=q.type==='interval'?['2','3','4','5']:q.type==='chord'?['Major','Minor']:names;$.innerHTML=`<div class="row"><button onclick="home()">✕ Exit</button><b>${s.mode==='timed'?'<span id="clock">'+s.remaining+'s</span>':(s.n+1)+'/10'}</b><b style="color:#d34">♥ ${s.hearts}</b></div><div class="track"><div class="bar" style="width:${s.mode==='timed'?s.remaining/60*100:s.n*10}%"></div></div><small>${s.mode==='review'?'Weak note review':s.mode==='timed'?'Speed challenge':lessons[s.i][0]}</small><h2>${({name:'Name this note',key:'Play the exact piano key',interval:'Name the interval',chord:'Major or minor triad?',melody:'Play the notes from left to right'})[q.type]}</h2><div class="panel">${staff(q.ps,q.type==='chord',false,q.type==='melody'?s.step:-1)}</div>${['key','melody'].includes(q.type)?keyboard():`<div class="choices">${choices.map(a=>`<button ${s.feedback?'disabled':''} class="${s.feedback&&a===q.ans?'good':''}" onclick="answer('${a}')">${a}</button>`).join('')}</div>`}${s.feedback?`<div class="panel ${s.feedback.ok?'good':'bad'}"><b>${s.feedback.ok?'Correct! +5 XP':'Correct answer: '+q.ans}</b></div><button class="primary" onclick="advance()">Continue</button>`:'<p class="muted">'+(q.type==='melody'?'Note '+(s.step+1)+' of '+q.ps.length:access?'MIDI connected · or tap an answer':'Tap an answer')+'</p>'}`}
function answer(a){if(!s||s.feedback)return;let q=s.q,p=q.ps[s.step],ok=a===q.ans;if(ok&&q.type==='melody'&&s.step<q.ps.length-1){s.step++;q.ans=full(q.ps[s.step]);quiz();return}if(ok){s.correct++;d.xp+=5;d.weak[p]=Math.max(0,(d.weak[p]||0)-1)}else{if(s.mode!=='timed')s.hearts--;d.weak[p]=(d.weak[p]||0)+1}s.feedback={ok};save();quiz();if(s.mode==='timed')advance()}
function advance(){if(!s||!s.feedback)return;s.n++;if(s.mode!=='timed'&&(s.n>=10||s.hearts<=0))finish();else next()}function finish(){clearInterval(timer);let a=s,passed=a.n>=10&&a.correct>=8;if(passed&&a.mode==='lesson'&&!d.done.includes(a.i)){d.done.push(a.i);d.xp+=20}if(a.mode==='timed')d.best=Math.max(d.best,a.correct);if(a.n&&!d.days.includes(day()))d.days.push(day());save();s=null;$.innerHTML=head()+`<div class="panel"><h1>${passed?'🏆 Lesson complete':a.mode==='timed'?'⏱ Time is up':'Keep practicing'}</h1><p>${a.correct} correct / ${a.n} answered</p>${a.mode==='timed'?'<p>Personal best: '+d.best+'</p>':'<p>Pass with at least 8 out of 10.</p>'}<button class="primary" onclick="home()">Continue</button><button style="width:100%;margin-top:12px" onclick="start(${a.i},'${a.mode}')">Try again</button></div>`}
function reference(){stop();$.innerHTML=head()+`<h1>Note reference</h1><div class="panel"><h2>Lines</h2>${staff([0,2,4,6,8],false,true)}<p>Good Boys Do Fine Always</p></div><div class="panel"><h2>Spaces</h2>${staff([1,3,5,7],false,true)}<p>All Cows Eat Grass</p></div><div class="panel"><h2>C landmarks</h2>${staff([-4,3,10],false,true)}<p>C4 is middle C.</p></div>`+nav()}
async function connect(){try{if(!navigator.requestMIDIAccess)throw Error('Web MIDI is not supported by this browser. Try Chrome or Edge on a computer.');access=await navigator.requestMIDIAccess();function attach(){for(let input of access.inputs.values())input.onmidimessage=e=>{let [status,n,v]=e.data;if((status&240)!==144||!v||!s||s.feedback)return;let p=range(-20,30).find(p=>midi(p)===n);if(p===undefined)return;if(s.q.type==='name')answer(note(p));else if(['key','melody'].includes(s.q.type))answer(full(p))};}attach();access.onstatechange=()=>{attach();if(!s)settings()};settings()}catch(e){document.getElementById('midiStatus').textContent=e.message}}
function settings(){stop();$.innerHTML=head()+`<h1>Settings</h1><div class="panel"><h2>MIDI piano</h2><p id="midiStatus">${access?access.inputs.size+' MIDI input(s) detected':'Connect a USB MIDI keyboard using a compatible browser.'}</p><button onclick="connect()">Connect MIDI</button><p class="muted">MIDI works for note naming, exact keys and melodies. iPhone Safari may not support Web MIDI.</p></div><div class="panel"><h2>Progress backup</h2><button onclick="exportData()">Export progress</button><p><input type="file" accept="application/json" onchange="importData(this)"></p></div>`+nav()}
function exportData(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(d)],{type:'application/json'}));a.download='bass-progress.json';a.click();URL.revokeObjectURL(a.href)}async function importData(el){try{let x=JSON.parse(await el.files[0].text());if(!Number.isFinite(x.xp)||!Array.isArray(x.done)||!Array.isArray(x.days)||!x.weak||typeof x.weak!=='object')throw Error();d=x;save();settings()}catch{alert('Invalid progress file')}}home();if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
